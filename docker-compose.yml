services:
  api:
    build: .
    command: sh -c "python -m backend.seed && uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
  bot:
    build: .
    command: python -m bot.main
    env_file: .env
    environment:
      API_URL: http://api:8000
    depends_on: [api]
    restart: unless-stopped
